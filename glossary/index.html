<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Glossary — XCMG</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EBEBEB;--surface:#FFFFFF;--panel:#F2F2F2;--border:#D0D0D0;--border2:#AAAAAA;
  --text:#111111;--muted:#555555;--dim:#888888;
  --dark:#1A1917;--accent:#7C3AED;
  --radius:6px;
  --font:'DM Sans',-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:'DM Mono',"SF Mono","Cascadia Code","Consolas",monospace;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* STICKY TOP ZONE (nav + header + controls) — mirrors Items */
.sticky-top{position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top,0px);background:var(--dark);}
@media (display-mode:standalone){.sticky-top{padding-top:max(env(safe-area-inset-top,0px),47px)}}

.sitenav{background:var(--dark);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:stretch;height:58px;flex-shrink:0;}
.sitenav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:rgba(255,255,255,.45);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;transition:color 0.15s;}
.sitenav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.sitenav a.active{color:var(--accent);}

.header{background:var(--dark);border-bottom:1px solid rgba(255,255,255,.08);padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;}
.logo{background:var(--accent);color:#fff;font-weight:800;font-size:13px;letter-spacing:2px;padding:5px 10px;border-radius:3px;flex-shrink:0;}
.header-title{font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;opacity:.95;}

/* CONTROLS */
.controls{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-direction:column;gap:8px;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none;}
#gsearch{width:100%;background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font);font-size:16px;font-weight:600;padding:9px 70px 9px 36px;outline:none;transition:border-color .15s;}
#gsearch:focus{border-color:var(--accent);}
#gsearch::placeholder{color:var(--dim);font-weight:500;}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--border2);border:none;border-radius:3px;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;cursor:pointer;display:none;font-family:var(--font);letter-spacing:.5px;}
.clear-btn.show{display:block;}
.filter-row{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{display:none;}
.fpill{flex-shrink:0;background:var(--panel);border:1.5px solid var(--border);border-radius:20px;color:var(--muted);font-size:12px;font-weight:700;padding:4px 12px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--font);}
.fpill:hover{border-color:var(--border2);color:var(--text);}
.fpill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* LIST — mirrors Items list rows */
.main{padding:0;}
.g-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface);}
.g-row:hover{background:var(--panel);}
.g-accent{width:3px;min-width:3px;align-self:stretch;background:var(--accent);border-radius:2px;}
.g-term{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);min-width:82px;flex-shrink:0;padding-top:1px;word-break:break-word;}
.g-def{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.45;}
.g-def b{color:var(--text);font-weight:700;}
.no-hit{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px;font-weight:600;}
.foot-note{padding:16px;text-align:center;color:var(--dim);font-size:11px;}
@media (min-width:601px){.g-term{min-width:110px;}}
</style>
</head>
<body>

<div class="sticky-top">
<nav class="sitenav">
  <a href="../index.html" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg><span>Home</span></a>
  <a href="../xcmg-reference/index.html" aria-label="Items"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Items</span></a>
  <a href="../charging-guide/index.html" aria-label="Charging Guide"><svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><path d="M16.5 7H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H7"/></svg><span>Charging</span></a>
  <a href="../quick-reference/index.html" aria-label="Quick Reference"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg><span>Quick</span></a>
  <a href="../gas-symbols/index.html" aria-label="Gas Symbols"><svg viewBox="0 0 24 24"><path d="M3 6.5 9 4.5 15 6.5 21 4.5V17.5L15 19.5 9 17.5 3 19.5Z"/><path d="M6.5 14.5 10 9 14 13 17.5 8.5"/><circle cx="10" cy="9" r="1.1"/><circle cx="14" cy="13" r="1.1"/></svg><span>Symbols</span></a>
  <a href="index.html" class="active" aria-label="Glossary"><svg viewBox="0 0 24 24"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H18v13H6.5A1.5 1.5 0 0 0 5 18.5v-13z"/><path d="M5 18.5A1.5 1.5 0 0 0 6.5 20H18"/><line x1="9" y1="8" x2="14" y2="8"/></svg><span>Glossary</span></a>
</nav>

<header class="header">
  <div class="logo">XCMG</div>
  <div class="header-title">Glossary</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="gsearch" placeholder="Search terms, acronyms, definitions…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear-btn" id="clearBtn">CLEAR</button>
  </div>
  <div class="filter-row" id="filterRow">
    <button class="fpill active" data-cat="all">All</button>
    <button class="fpill" data-cat="pressure">Pressure</button>
    <button class="fpill" data-cat="materials">Materials</button>
    <button class="fpill" data-cat="charging">Charging</button>
    <button class="fpill" data-cat="suffix">Suffixes</button>
    <button class="fpill" data-cat="procedures">Procedures</button>
    <button class="fpill" data-cat="nycdot">NYCDOT</button>
    <button class="fpill" data-cat="acronyms">Acronyms</button>
  </div>
</div>
</div><!-- /sticky-top -->

<div class="main"><div id="glossaryList"></div></div>

<script>
// ── Glossary data (grouped by category; meant to grow) ──────────
var TERMS = [
  {t:'LP',  d:'<b>Low Pressure</b> — 4″ to 12″ WC.', c:'pressure'},
  {t:'IP',  d:'<b>Intermediate Pressure</b> — 1 to 5 PSIG.', c:'pressure'},
  {t:'MP',  d:'<b>Medium Pressure</b> — 2 to 15 PSIG.', c:'pressure'},
  {t:'HP',  d:'<b>High Pressure</b> — 15 to 99 PSIG.', c:'pressure'},
  {t:'XHP', d:'<b>Extra High Pressure</b> — 125 to 350 PSIG. On the Con Edison network, XHP has replaced the older term Transmission Pressure (TP).', c:'pressure'},

  {t:'PE',      d:'<b>Polyethylene</b> — plastic gas pipe; the standard for new mains & services.', c:'materials'},
  {t:'ST',      d:'<b>Steel</b> — used for higher-pressure mains, services & risers.', c:'materials'},
  {t:'CS',      d:'<b>Carbon Steel</b>.', c:'materials'},
  {t:'CI / WI', d:'<b>Cast Iron / Wrought Iron</b> — legacy main material targeted for replacement.', c:'materials'},
  {t:'TOR',     d:'<b>Threaded O-Ring</b> — a type of pipe fitting.', c:'materials'},

  {t:'Capital',    d:'New plant or betterment charged to a capital project (Main Account).', c:'charging'},
  {t:'O&M',        d:'<b>Operations & Maintenance</b> — expense work (repair / replace in kind).', c:'charging'},
  {t:'Retirement', d:'Removal or abandonment of existing facilities (CI/WI, ST, or PE).', c:'charging'},

  {t:'1 / 2 / 3', d:'Service territory length: <b>1</b> = Manhattan (≤30′) · <b>2</b> = Queens / Bronx (≤50′) · <b>3</b> = Westchester (≤65′).', c:'suffix'},
  {t:'S',         d:'Steel service (vs. the default plastic).', c:'suffix'},
  {t:'I / II',    d:'<b>I</b> = within (≤) territory length · <b>II</b> = beyond (>) territory length.', c:'suffix'},
  {t:'A / R / I', d:'Restoration (Micro): <b>A</b> = installation only · <b>R</b> = removal + installation · <b>I</b> = incremental (stacks with other suffixes).', c:'suffix'},

  {t:'IP8', d:'Con Edison gas procedure — <i>summary to be added.</i>', c:'procedures'},
  {t:'IP9', d:'Con Edison gas procedure — <i>summary to be added.</i>', c:'procedures'},

  {t:'MPT', d:'<b>Maintenance and Protection of Traffic</b> — the NYCDOT-required plan for safely routing vehicles & pedestrians around the work zone.', c:'nycdot'},

  {t:'MAOP',    d:'<b>Maximum Allowable Operating Pressure</b> — the highest pressure a segment may be operated at.', c:'acronyms'},
  {t:'API',     d:'<b>American Petroleum Institute</b> — publishes gas/oil pipe & equipment standards.', c:'acronyms'},
  {t:'ASME',    d:'<b>American Society of Mechanical Engineers</b> — publishes the B31.8 gas piping code.', c:'acronyms'},
  {t:'WC',      d:'<b>Water Column</b> (inches) — the unit used to measure low-pressure gas.', c:'acronyms'},
  {t:'WO / WR', d:'<b>Work Order / Work Request</b> — the job number a ticket is charged to.', c:'acronyms'},
  {t:'POET',    d:'<b>Project · Organization · Expenditure · Task</b> — the charging string that routes a cost (see Charging Guide).', c:'acronyms'},
  {t:'T&E',     d:'<b>Time & Equipment</b> — recorded in its own section on the cWorx daily log, approved per trade & equipment, per day. (Legacy item T350 is being phased out.)', c:'acronyms'},
  {t:'Stip',    d:'<b>Stipulation</b> — the payment factor (multiplier) set by the work-window timing.', c:'acronyms'},
  {t:'HVI',     d:'<b>High Value Item</b> — e.g. rock removal; requires a photo with placard before backfill.', c:'acronyms'},
  {t:'M&S',     d:'<b>Mains & Services</b>.', c:'acronyms'},
  {t:'NBS',     d:'<b>New Business Service</b> — a gas service installed for a new customer connection.', c:'acronyms'},
  {t:'MRP',     d:'<b>Main Replacement Program</b> — replacing leak-prone (CI/WI, ST) mains with PE.', c:'acronyms'},
  {t:'DLR',     d:'<b>Daily Log Report</b> — the per-day crew & equipment record (see the Field Log app).', c:'acronyms'}
];

var activeCat = 'all';
var listEl  = document.getElementById('glossaryList');
var input   = document.getElementById('gsearch');
var clearBtn= document.getElementById('clearBtn');

function norm(s){ return s.toLowerCase().replace(/[^a-z0-9]/g,''); }
function stripHtml(s){ return s.replace(/<[^>]+>/g,''); }

function render(){
  var q = input.value.trim();
  var ql = q.toLowerCase(), qn = norm(q);
  clearBtn.className = q ? 'clear-btn show' : 'clear-btn';

  var rows = TERMS.filter(function(x){
    if (activeCat !== 'all' && x.c !== activeCat) return false;
    if (!q) return true;
    var hay = x.t + ' ' + stripHtml(x.d);
    return hay.toLowerCase().indexOf(ql) !== -1 || (qn && norm(hay).indexOf(qn) !== -1);
  });

  if (!rows.length){
    listEl.innerHTML = '<div class="no-hit">No matching terms — try another word.</div>';
    return;
  }
  listEl.innerHTML = rows.map(function(x){
    return '<div class="g-row"><div class="g-accent"></div><div class="g-term">'+x.t+'</div><div class="g-def">'+x.d+'</div></div>';
  }).join('') + '<div class="foot-note">Starter set — more terms will be added over time.</div>';
}

input.addEventListener('input', render);
clearBtn.addEventListener('click', function(){ input.value=''; input.focus(); render(); });
document.getElementById('filterRow').addEventListener('click', function(e){
  var b = e.target.closest('.fpill'); if(!b) return;
  activeCat = b.getAttribute('data-cat');
  var pills = this.querySelectorAll('.fpill');
  for (var i=0;i<pills.length;i++) pills[i].classList.toggle('active', pills[i]===b);
  render();
});

render();
</script>

<script src="../version.js"></script>
</body>
</html>
